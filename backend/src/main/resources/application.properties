spring.application.name=video-management-system
server.port=${PORT:${APP_PORT:8080}}
server.address=${APP_HOST:127.0.0.1}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.forward-headers-strategy=framework
server.error.include-message=never
app.demo.admin.enabled=${APP_DEMO_ADMIN_ENABLED:true}
app.database.mode=${DB_MODE:JDBC_FALLBACK}
app.database.url=${DB_URL:jdbc:sqlite:../database/videos.db}
app.database.driver=${DB_DRIVER:org.sqlite.JDBC}
app.database.username=${DB_USER:}
app.database.password=${DB_PASSWORD:}
app.database.dsn=${DB_DSN:}

